<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Task Force — ALX Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#03134F; --navy2:#0A2170; --twi:#0452F0; --icy:#C5E5FF; --pale:#EBF6FF;
    --sun:#EAB308; --jas:#FDE791; --green:#1E9E6A; --red:#C0392B;
    --grey:#5B6B86; --ink:#20304F; --line:#DCE6F7; --bg:#EEF3FC;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{font-family:'Poppins',system-ui,sans-serif; color:var(--ink); background:var(--navy);}
  .wrap{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden;}
  /* header */
  .top{background:var(--navy); color:#fff; padding:15px 18px 16px; position:relative; overflow:hidden;}
  .top::after{content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle at 30% 30%, rgba(4,82,240,.55), transparent 70%);}
  .toprow{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2;}
  .brand{font-weight:800; font-size:18px; letter-spacing:.2px;}
  .brand span{color:var(--icy); font-weight:400;}
  .gtag{background:var(--sun); color:var(--navy); font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px;}
  .gtag.hide{display:none;}
  /* stepper */
  .steps{display:flex; gap:6px; margin-top:14px; position:relative; z-index:2;}
  .steps.hide{display:none;}
  .steps .s{flex:1; height:4px; border-radius:3px; background:rgba(255,255,255,.18);}
  .steps .s.done{background:var(--icy);}
  .steps .s.cur{background:var(--sun);}
  .steplab{margin-top:7px; font-size:11px; color:var(--icy); font-weight:500; position:relative; z-index:2; letter-spacing:.2px;}
  .steplab.hide{display:none;}
  /* screen */
  .screen{flex:1; padding:20px 18px 130px; animation:fade .32s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(7px);} to{opacity:1; transform:none;}}
  @keyframes pop{from{opacity:0; transform:scale(.96);} to{opacity:1; transform:none;}}
  .kick{color:var(--twi); font-weight:700; font-size:11.5px; letter-spacing:1.4px; text-transform:uppercase; margin:0 0 7px;}
  h1{font-size:26px; font-weight:800; color:var(--navy); margin:0 0 15px; line-height:1.16; letter-spacing:-.3px;}
  h2{font-size:21px; font-weight:700; color:var(--navy); margin:0 0 11px; line-height:1.2; letter-spacing:-.2px;}
  p{font-size:15px; line-height:1.6; color:var(--ink); margin:0 0 14px;}
  .muted{color:var(--grey); font-size:13.5px; line-height:1.55;}
  .brief{background:#fff; border-radius:16px; padding:18px; margin:0 0 16px; box-shadow:0 6px 20px rgba(3,19,79,.06); border:1px solid var(--line);}
  .brief p{margin:0 0 11px; font-size:15px;}
  .brief p:last-child{margin:0;}
  .quote{font-weight:700; color:var(--navy);}
  .note{background:var(--jas); border-radius:13px; padding:13px 15px; font-size:13.5px; color:var(--navy); font-weight:500; line-height:1.5;}
  /* group grid */
  .ggrid{display:grid; grid-template-columns:1fr 1fr; gap:13px; margin-top:10px;}
  .gbtn{background:#fff; border:2px solid var(--line); border-radius:18px; padding:30px 0; text-align:center; font-size:20px; font-weight:700; color:var(--navy); cursor:pointer; transition:.16s; box-shadow:0 4px 14px rgba(3,19,79,.05);}
  .gbtn:active{transform:scale(.96);}
  .gbtn.sel{background:var(--navy); color:#fff; border-color:var(--navy); box-shadow:0 8px 22px rgba(3,19,79,.28);}
  .gbtn.wide{grid-column:1 / -1; padding:22px 0;}
  /* budget */
  .bwrap{background:#fff; border-radius:15px; padding:13px 15px; margin-bottom:15px; box-shadow:0 5px 16px rgba(3,19,79,.06); border:1px solid var(--line); position:sticky; top:8px; z-index:4;}
  .brow{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px;}
  .brow .lab{font-size:13.5px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:6px;}
  .brow .val{font-size:13px; color:var(--grey); font-weight:500;}
  .brow .val b{color:var(--navy);}
  .bar{height:10px; background:var(--pale); border-radius:6px; overflow:hidden;}
  .bar > i{display:block; height:100%; background:var(--twi); width:0; transition:width .3s cubic-bezier(.3,.8,.3,1); border-radius:6px;}
  .bar.warn > i{background:var(--sun);}
  .coin{width:16px;height:16px;border-radius:50%;background:var(--sun);display:inline-block;position:relative;box-shadow:inset 0 0 0 2px rgba(3,19,79,.25);}
  /* cards */
  .card{display:flex; align-items:center; gap:13px; width:100%; text-align:left;
    background:#fff; border:2px solid transparent; border-radius:16px; padding:14px; margin-bottom:11px; cursor:pointer; transition:.15s;
    box-shadow:0 4px 14px rgba(3,19,79,.05); animation:pop .3s ease;}
  .card:active{transform:scale(.99);}
  .ico{flex:none; width:44px; height:44px; border-radius:13px; background:var(--pale); display:flex; align-items:center; justify-content:center; color:var(--twi);}
  .ico svg{width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
  .card .body{flex:1; min-width:0;}
  .card .nm{font-size:15px; font-weight:700; color:var(--navy); line-height:1.2;}
  .card .sub{font-size:12.5px; color:var(--grey); margin-top:2px; line-height:1.3;}
  .card .cost{flex:none; display:flex; flex-direction:column; align-items:center; gap:2px;}
  .card .cost .n{font-size:17px; font-weight:800; color:var(--navy);}
  .card .cost .u{font-size:9.5px; color:var(--grey); text-transform:uppercase; letter-spacing:.5px;}
  .card.on{background:var(--navy); box-shadow:0 10px 24px rgba(3,19,79,.26);}
  .card.on .nm{color:#fff;} .card.on .sub{color:var(--icy);}
  .card.on .ico{background:var(--sun); color:var(--navy);}
  .card.on .cost .n{color:var(--jas);} .card.on .cost .u{color:var(--icy);}
  .card.dis{opacity:.4; pointer-events:none;}
  /* reveal */
  .rev{border-radius:16px; padding:15px; margin-bottom:12px; display:flex; gap:13px; align-items:flex-start; animation:pop .35s ease; box-shadow:0 4px 14px rgba(3,19,79,.05);}
  .rev.ok{background:#E7F6EF; border:1px solid #b8e6d3;} .rev.hit{background:#FCEBE8; border:1px solid #f3cdc7;}
  .rev .ic{flex:none; width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:#fff;}
  .rev .ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .rev.ok .ic{background:var(--green);} .rev.hit .ic{background:var(--red);}
  .rev .ttl{font-size:15.5px; font-weight:700; color:var(--navy); margin:0 0 2px;}
  .rev .ds{font-size:13px; line-height:1.45; margin:0;}
  .rev.ok .ds{color:#0f6e56;} .rev.hit .ds{color:#9a3125;}
  .budgetnote{background:var(--navy); color:#fff; border-radius:17px; padding:17px; margin:17px 0 4px; text-align:center; box-shadow:0 10px 26px rgba(3,19,79,.25);}
  .budgetnote .cap{font-size:13px; color:var(--icy);}
  .budgetnote b{font-size:30px; font-weight:800; color:var(--jas); display:block; margin-top:4px;}
  .cut{color:var(--jas); font-size:12.5px; margin-top:7px; background:rgba(234,179,8,.16); padding:6px 10px; border-radius:9px; display:inline-block;}
  /* lock */
  .lockcard{background:#fff; border-radius:18px; padding:26px 20px; text-align:center; box-shadow:0 8px 24px rgba(3,19,79,.08); border:1px solid var(--line); margin-top:10px;}
  .lockic{width:60px; height:60px; margin:0 auto 14px; border-radius:50%; background:var(--pale); display:flex; align-items:center; justify-content:center; color:var(--twi);}
  .lockic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .codein{width:100%; text-align:center; font-family:inherit; font-size:26px; font-weight:700; letter-spacing:8px; color:var(--navy); border:2px solid var(--line); border-radius:13px; padding:14px; margin-top:6px; outline:none;}
  .codein:focus{border-color:var(--twi);}
  .err{color:var(--red); font-size:13px; font-weight:600; margin-top:9px; min-height:16px;}
  /* result */
  .scorebox{background:var(--navy); border-radius:20px; padding:26px 20px; text-align:center; color:#fff; margin-bottom:18px; box-shadow:0 12px 30px rgba(3,19,79,.28); position:relative; overflow:hidden;}
  .scorebox::after{content:""; position:absolute; left:-30px; bottom:-40px; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle,rgba(4,82,240,.5),transparent 70%);}
  .ringwrap{position:relative; width:150px; height:150px; margin:0 auto 8px; z-index:2;}
  .ring{transform:rotate(-90deg);}
  .ring .bg{fill:none; stroke:rgba(255,255,255,.14); stroke-width:11;}
  .ring .fg{fill:none; stroke:var(--sun); stroke-width:11; stroke-linecap:round; transition:stroke-dashoffset 1.1s cubic-bezier(.3,.8,.3,1);}
  .ringtxt{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ringtxt .n{font-size:46px; font-weight:800; line-height:1;}
  .ringtxt .d{font-size:13px; color:var(--icy);}
  .verdict{font-size:15px; line-height:1.5; color:var(--icy); position:relative; z-index:2;}
  .brk{background:#fff; border-radius:16px; padding:8px 16px; margin-bottom:12px; box-shadow:0 5px 16px rgba(3,19,79,.06); border:1px solid var(--line);}
  .brk .li{display:flex; justify-content:space-between; align-items:center; font-size:14px; padding:10px 0; border-bottom:1px solid var(--line);}
  .brk .li:last-child{border-bottom:0;}
  .brk .li .pos{color:var(--green); font-weight:700;}
  .brk .li .neg{color:var(--red); font-weight:700;}
  .brk .li .nm{color:var(--ink); font-weight:500;}
  .brk .li .nm small{display:block; color:var(--grey); font-size:11.5px; font-weight:400;}
  /* footer button */
  .foot{position:fixed; bottom:0; left:0; right:0; padding:14px 18px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(to top,var(--bg) 66%,rgba(238,243,252,0));}
  .foot .inner{max-width:480px; margin:0 auto;}
  .btn{display:block; width:100%; border:0; border-radius:15px; padding:17px; font-family:inherit; font-size:16.5px; font-weight:700; cursor:pointer; transition:.15s; box-shadow:0 8px 20px rgba(3,19,79,.16);}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--sun); color:var(--navy);}
  .btn.blue{background:var(--twi); color:#fff;}
  .btn.ghost{background:#fff; color:var(--navy); border:1.5px solid var(--line); box-shadow:none;}
  .btn:disabled{opacity:.45; cursor:default; box-shadow:none;}
  .reset{position:absolute; top:15px; right:16px; background:rgba(255,255,255,.14); border:0; color:#fff; font-size:11px; font-family:inherit; cursor:pointer; padding:5px 10px; border-radius:14px; z-index:6;}
  .center{text-align:center;}
  .pill{display:inline-block; background:var(--jas); color:var(--navy); font-weight:700; font-size:12.5px; padding:6px 14px; border-radius:20px; margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="toprow">
      <div class="brand">The Task Force <span>· ALX</span></div>
      <div class="gtag hide" id="gtag"></div>
    </div>
    <div class="steps hide" id="steps"></div>
    <div class="steplab hide" id="steplab"></div>
  </div>
  <div class="screen" id="screen"></div>
  <div class="foot"><div class="inner" id="foot"></div></div>
</div>

<script>
/* ================= CONFIG =================
   Filled in by the server from the Config and Options tabs of the spreadsheet. */
const BOOT=<?!= boot ?>;
const TOTAL=BOOT.total, R1_CAP=BOOT.r1Cap, GROUPS=BOOT.groups;
const R1=BOOT.options.filter(o=>o.round===1);
const R2=BOOT.options.filter(o=>o.round===2);

/* ================= ICONS ================= */
const ICONS={
 mandate:'<path d="M6 21V4M6 4h11l-2.5 4L17 12H6"/>',
 guardrails:'<path d="M12 3l7 3v5c0 4.2-3 7.4-7 8.4C8 18.4 5 15.2 5 11V6z"/><path d="M9 12l2 2 4-4"/>',
 pilot:'<path d="M13 3L5 13h5l-1 8 8-11h-5z"/>',
 licences:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
 training:'<path d="M3 9l9-4 9 4-9 4z"/><path d="M7 11v4.5c0 1 2.5 2.5 5 2.5s5-1.5 5-2.5V11"/>',
 workshop:'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M16 6a3 3 0 010 6M21 20c0-2.6-1.6-4.3-4-4.8"/>',
 contain:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/><path d="M5.5 5.5l3.5 3.5M15 15l3.5 3.5M18.5 5.5L15 9M9 15l-3.5 3.5"/>',
 scale:'<path d="M4 17l6-6 4 4 6-7"/><path d="M17 8h4v4"/>',
 roi:'<path d="M5 20v-6M10 20V8M15 20v-10M20 20V5"/><path d="M3 20h18"/>',
 cowide:'<path d="M4 21V8l6-3v16M10 21V5l8 3v13"/><path d="M3 21h18M13 10h2M13 13h2M13 16h2M7 12h1M7 15h1"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 check:'<path d="M5 12l4 4L19 7"/>', alert:'<path d="M12 8v5M12 16.5v.5"/><path d="M10.3 4l-7 12a2 2 0 001.7 3h14a2 2 0 001.7-3l-7-12a2 2 0 00-3.4 0z"/>',
};
const svg = k => `<svg viewBox="0 0 24 24">${ICONS[k]||''}</svg>`;

/* ================= STATE ================= */
const KEY='taskforce_v2';
let S=load()||{group:null, phase:'pick', r1:[], r2:[], r2budget:0};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}

/* ================= HELPERS ================= */
const all=id=>R1.find(c=>c.id===id)||R2.find(c=>c.id===id);
const cost1=ids=>ids.reduce((s,i)=>s+all(i).cost,0);
const has=(a,i)=>a.includes(i);
// Which setbacks the round 1 picks protect against (the "protects" column).
function cov(r1){const p=k=>r1.some(id=>all(id).protects.includes(k));return{leak:p('leak'),board:p('board'),adopt:p('adopt')};}
function reserveAfterR1(){const cv=cov(S.r1);let r=TOTAL-cost1(S.r1);if(!cv.board)r=Math.floor(r*(100-BOOT.boardCut)/100);return r;}
// Round 2 options on offer: "only_if_hit" options appear only when that setback hit.
function r2menu(){const cv=cov(S.r1);return R2.filter(c=>!c.onlyIfHit||!cv[c.onlyIfHit]).map(c=>c.id);}
// Full points only when every setback in "needs" was avoided; otherwise "points_without".
const needsMet=c=>{const cv=cov(S.r1);return c.needs.every(k=>cv[k]);};
function r2points(id){const c=all(id);return needsMet(c)?c.points:c.pointsWithout;}
function finalScore(){
  const cv=cov(S.r1); let pts=0; const items=[];
  S.r1.forEach(id=>{const c=all(id); pts+=c.points; items.push({nm:c.name, v:c.points});});
  S.r2.forEach(id=>{const c=all(id); const v=r2points(id); pts+=v;
    items.push({nm:c.name, v, note:needsMet(c)?c.note:(c.noteWithout||c.note)});});
  let pen=0; const pens=[];
  if(!cv.leak){pen+=BOOT.leakPenalty; pens.push({nm:'Data leak — no guardrails', v:-BOOT.leakPenalty});}
  if(!cv.adopt){pen+=BOOT.adoptPenalty; pens.push({nm:'Adoption stalled — no people move', v:-BOOT.adoptPenalty});}
  if(!cv.board) pens.push({nm:'Board cut your budget — no pilot', v:0, note:'fewer coins in round 2'});
  return {score:Math.max(0,Math.min(100,pts-pen)), items, pens, cov:cv};
}
function verdict(s){
  if(s>=80) return "AI isn't a project at Company X anymore, it's how people work. The board wants you to lead it across the group.";
  if(s>=60) return "Real progress, and you dodged the worst of it. The gaps you left cost you time and trust, but you're moving.";
  if(s>=40) return "You made a start, but the shocks exposed what you skipped. There's a lot left to rebuild.";
  return "You spent on the shiny things and left the foundations bare. A year on, Company X is busy, anxious, and no readier than day one.";
}

/* ================= BACKEND (Apps Script) ================= */
// Calls a server function in Code.gs. Resolves with its return value, rejects on network/server error.
function server(fn,arg){
  return new Promise((ok,fail)=>google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn](arg));
}
function payload(round){
  const cv=cov(S.r1), p={group:S.group, round, r1:S.r1, r2:round===2?S.r2:[], leak:cv.leak, board:cv.board, adopt:cv.adopt, spent:cost1(S.r1)};
  if(round===2) p.score=finalScore().score;
  return p;
}
// Shows "Sending…" on the footer button; on failure puts the button back with an error so the group can retry.
function busy(label){const b=document.querySelector('#foot .btn'); if(b){b.disabled=true; b.textContent=label;}}
function sendFailed(msg){render(); const f=document.getElementById('foot');
  f.insertAdjacentHTML('afterbegin',`<div class="err" style="text-align:center;margin:0 0 8px">${msg}</div>`);}

/* ================= CHROME (stepper) ================= */
const STEP=['pick','brief','round1','submitted1','reveal','round2','result'];
const STEPMAP={brief:0,round1:1,submitted1:2,reveal:2,round2:3,result:4};
const STEPLABS=['The brief','First six months','Six months in','Next six months','The year in review'];
function chrome(){
  const g=document.getElementById('gtag');
  if(S.group){g.textContent='Group '+S.group; g.classList.remove('hide');} else g.classList.add('hide');
  const st=document.getElementById('steps'), sl=document.getElementById('steplab');
  if(S.phase==='pick'){st.classList.add('hide'); sl.classList.add('hide'); return;}
  st.classList.remove('hide'); sl.classList.remove('hide');
  const idx=STEPMAP[S.phase]!=null?STEPMAP[S.phase]:0;
  let h=''; for(let i=0;i<5;i++) h+=`<div class="s ${i<idx?'done':''} ${i===idx?'cur':''}"></div>`;
  st.innerHTML=h; sl.textContent=STEPLABS[idx];
}

/* ================= RENDER ================= */
function render(){
  chrome();
  const scr=document.getElementById('screen'), ft=document.getElementById('foot');
  window.scrollTo(0,0);
  const P=S.phase;
  if(P==='pick') return pick(scr,ft);
  if(P==='brief') return brief(scr,ft);
  if(P==='round1') return round(scr,ft,1);
  if(P==='submitted1') return waitlock(scr,ft);
  if(P==='reveal') return reveal(scr,ft);
  if(P==='round2') return round(scr,ft,2);
  if(P==='result') return result(scr,ft);
}
function pick(scr,ft){
  let g='';
  for(let i=1;i<=GROUPS;i++){
    const wide=(GROUPS%2===1 && i===GROUPS)?'wide':'';
    g+=`<div class="gbtn ${wide} ${S.group==i?'sel':''}" onclick="doPick(${i})">Group ${i}</div>`;
  }
  scr.innerHTML=`
    <button class="reset" onclick="resetAll(this)">reset</button>
    <p class="kick">One company · one year · your call</p>
    <h1>Which group are you?</h1>
    <p class="muted">Tap your table number. It stays for the whole game, so keep this device with your group and don't close the tab.</p>
    <div class="ggrid">${g}</div>`;
  ft.innerHTML=`<button class="btn primary" ${S.group?'':'disabled'} onclick="toBrief()">Start</button>`;
}
function brief(scr,ft){
  scr.innerHTML=`
    <p class="kick">The brief</p>
    <h1>You lead people and learning at Company X.</h1>
    <div class="brief">
      <p>A hundred people. Your CEO just came back from a conference and made AI your problem too: <span class="quote">"Make us an AI-first company. This year."</span></p>
      <p>The board has put money behind it, your <b>${TOTAL} coins</b> for the year. What there isn't yet is a plan, an owner, or a single rule.</p>
      <p>Half your people are already using AI quietly, on personal accounts. Where do you start?</p>
    </div>
    <div class="note">You can commit up to <b>${R1_CAP} coins</b> in the first six months. The rest stays in reserve for whatever the year brings.</div>`;
  ft.innerHTML=`<button class="btn primary" onclick="startR1()">Begin — your first six months</button>`;
}
function round(scr,ft,rnd){
  const isR1=rnd===1, picked=isR1?S.r1:S.r2, cap=isR1?R1_CAP:S.r2budget;
  const menu=isR1?null:r2menu();
  const spent=cost1(picked), remain=cap-spent, pool=isR1?R1:R2.filter(c=>menu.includes(c.id));
  const kick=isR1?'Round 1 · first six months':'Round 2 · the next six months';
  const head=isR1?'What do you do first?':'Recover, or grow?';
  let cards='';
  pool.forEach(c=>{
    const on=has(picked,c.id), dis=!on&&c.cost>remain;
    cards+=`<div class="card ${on?'on':''} ${dis?'dis':''}" onclick="toggle('${c.id}',${rnd})">
      <div class="ico">${svg(c.icon)}</div>
      <div class="body"><div class="nm">${c.name}</div><div class="sub">${c.sub}</div></div>
      <div class="cost"><span class="n">${c.cost}</span><span class="u">coins</span></div></div>`;
  });
  const pct=cap>0?Math.min(100,Math.round(spent/cap*100)):0;
  scr.innerHTML=`
    <p class="kick">${kick}</p>
    <h2>${head}</h2>
    <div class="bwrap">
      <div class="brow"><span class="lab"><span class="coin"></span> Coins to spend</span><span class="val"><b>${remain}</b> of ${cap} left</span></div>
      <div class="bar ${remain<=10?'warn':''}"><i style="width:${pct}%"></i></div>
    </div>
    ${cards}
    <p class="muted" style="margin-top:4px">${isR1?"You can't afford everything. Choose what matters most before you know what the year brings.":"These are your options given how the year went. Recovery repairs what broke; growth pays off only if the foundations held."}</p>`;
  ft.innerHTML=`<button class="btn primary" onclick="${isR1?'submitR1()':'submitR2()'}">${isR1?'Submit round 1':"Submit — that's the year"}</button>`;
}
function waitlock(scr,ft){
  scr.innerHTML=`
    <div class="center">
      <div class="pill">Round 1 locked in</div>
      <div class="lockcard">
        <div class="lockic">${svg('lock')}</div>
        <h2>Sit tight, Group ${S.group}.</h2>
        <p class="muted">Your first six months are in. When the facilitator reveals the year, enter the code to see what happened to you.</p>
        <input class="codein" id="code" inputmode="numeric" maxlength="6" placeholder="••••" oninput="clearErr()" />
        <div class="err" id="err"></div>
      </div>
    </div>`;
  ft.innerHTML=`<button class="btn blue" onclick="tryReveal()">Reveal what happened</button>`;
}
function reveal(scr,ft){
  const cv=cov(S.r1), half=BOOT.boardCut===50;
  const rows=[
   {ok:cv.leak, t:'The leak',
    okd:'A staffer pasted a client file into a public chatbot. Your guardrails caught it in time.',
    hd:'A staffer leaked a client file into a public chatbot. With no rules in place, it landed on you. −'+BOOT.leakPenalty},
   {ok:cv.board, t:'The board',
    okd:'They came to see a win. Your pilot gave them one, so your budget holds.',
    hd:'They came to see a win. You had none, so they cut your remaining budget '+(half?'in half':'by '+BOOT.boardCut+'%')+'.'},
   {ok:cv.adopt, t:'Adoption',
    okd:'People are actually using it. The investment in your people paid off.',
    hd:'Almost no one is using what you rolled out. With no one bringing people along, it stalled. −'+BOOT.adoptPenalty},
  ];
  let html=''; rows.forEach(r=>{ html+=`<div class="rev ${r.ok?'ok':'hit'}">
     <div class="ic">${svg(r.ok?'check':'alert')}</div>
     <div><p class="ttl">${r.t}</p><p class="ds">${r.ok?r.okd:r.hd}</p></div></div>`; });
  const res=reserveAfterR1();
  scr.innerHTML=`
    <p class="kick">Six months in</p>
    <h2>What happened to Group ${S.group}</h2>
    ${html}
    <div class="budgetnote"><span class="cap">Budget left for the next six months</span><b>${res} coins</b>
      ${!cv.board?`<div class="cut">The board ${half?'halved your reserve':'cut your reserve by '+BOOT.boardCut+'%'} — no pilot, no proof.</div>`:''}</div>`;
  ft.innerHTML=`<button class="btn blue" onclick="startR2()">Play round 2 →</button>`;
}
function result(scr,ft){
  const f=finalScore(), C=2*Math.PI*63, off=C*(1-f.score/100);
  let li='';
  f.items.forEach(it=>{ li+=`<div class="li"><span class="nm">${it.nm}${it.note?`<small>${it.note}</small>`:''}</span><span class="${it.v>0?'pos':'neg'}">${it.v>0?'+':''}${it.v}</span></div>`; });
  f.pens.forEach(p=>{ li+=`<div class="li"><span class="nm">${p.nm}${p.note?`<small>${p.note}</small>`:''}</span><span class="neg">${p.v?p.v:'—'}</span></div>`; });
  scr.innerHTML=`
    <p class="kick">Twelve months on</p>
    <h2>Group ${S.group} — the year in review</h2>
    <div class="scorebox">
      <div class="ringwrap">
        <svg class="ring" width="150" height="150" viewBox="0 0 150 150">
          <circle class="bg" cx="75" cy="75" r="63"></circle>
          <circle class="fg" id="ringfg" cx="75" cy="75" r="63" stroke-dasharray="${C}" stroke-dashoffset="${C}"></circle>
        </svg>
        <div class="ringtxt"><span class="n">${f.score}</span><span class="d">out of 100</span></div>
      </div>
      <div class="verdict">${verdict(f.score)}</div>
    </div>
    <div class="brk">${li}</div>
    <p class="muted center">Show this to the room. Your score is on the scoreboard.</p>`;
  ft.innerHTML=`<button class="btn ghost" onclick="resetAll(this)">Reset this device</button>`;
  requestAnimationFrame(()=>{const el=document.getElementById('ringfg'); if(el) el.setAttribute('stroke-dashoffset',off);});
}

/* ================= ACTIONS ================= */
function doPick(n){S.group=n; save(); render();}
function toBrief(){if(!S.group)return; S.phase='brief'; save(); render();}
function startR1(){S.phase='round1'; save(); render();}
function toggle(id,rnd){
  const arr=rnd===1?S.r1:S.r2, cap=rnd===1?R1_CAP:S.r2budget, i=arr.indexOf(id);
  if(i>=0) arr.splice(i,1);
  else{ if(cost1(arr)+all(id).cost>cap) return; arr.push(id); }
  save(); render();
}
function submitR1(){
  busy('Sending…');
  server('submitRound',payload(1))
    .then(()=>{S.phase='submitted1'; save(); render();})
    .catch(()=>sendFailed("Couldn't send. Check the connection and tap again."));
}
function clearErr(){const e=document.getElementById('err'); if(e)e.textContent='';}
function tryReveal(){
  const v=((document.getElementById('code')||{}).value||'').trim();
  if(!v) return;
  busy('Checking…');
  server('checkCode',v).then(ok=>{
    if(ok){S.phase='reveal'; save(); render(); return;}
    waitlock(document.getElementById('screen'),document.getElementById('foot'));
    document.getElementById('code').value=v;
    document.getElementById('err').textContent='Not the right code. Wait for the facilitator.';
  }).catch(()=>sendFailed("Couldn't check the code. Check the connection and try again."));
}
function startR2(){S.r2budget=reserveAfterR1(); S.phase='round2'; save(); render();}
function submitR2(){
  busy('Sending…');
  server('submitRound',payload(2))
    .then(()=>{S.phase='result'; save(); render();})
    .catch(()=>sendFailed("Couldn't send. Check the connection and tap again."));
}
// Two taps to reset (pop-up dialogs aren't reliable inside Apps Script pages).
let resetArmed=null;
function resetAll(btn){
  if(!resetArmed){
    const was=btn.textContent; btn.textContent='Tap again to reset';
    resetArmed=setTimeout(()=>{resetArmed=null; btn.textContent=was;},3000);
    return;
  }
  clearTimeout(resetArmed); resetArmed=null;
  S={group:null, phase:'pick', r1:[], r2:[], r2budget:0}; save(); render();
}
// Drop picks that no longer exist (e.g. an option was removed from the sheet mid-game).
S.r1=(S.r1||[]).filter(all); S.r2=(S.r2||[]).filter(all);
render();
</script>
